<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Location Finder</title>
<style>
:root {
  --bg:#f7f4ee; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --line:#e5e7eb; --navy:#1f2f46; --navy-hover:#162337;
  --yellow:#f4c542; --yellow-soft:#fff7d6;
  --shadow:0 14px 38px rgba(31,41,55,.08); --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
.page-shell{min-height:100vh;padding:36px 24px 60px}
.wrap{width:min(1180px,100%);margin:0 auto;padding:0}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px;text-align:left}
.brand-block{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.header h1{margin:0;font-size:clamp(2rem,4vw,3.2rem);line-height:1;color:var(--navy);letter-spacing:-.03em}
.header p{margin:10px 0 0;color:var(--muted);font-size:1rem}
.status-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:.85rem;color:var(--muted);box-shadow:0 4px 14px rgba(31,41,55,.04);white-space:nowrap}
.status-dot{width:8px;height:8px;border-radius:50%;background:#38a169}
.card{background:var(--card);border:1px solid rgba(229,231,235,.8);border-radius:var(--radius);padding:0;box-shadow:var(--shadow);overflow:visible}
.card-accent{height:6px;background:var(--yellow);border-radius:var(--radius) var(--radius) 0 0}
.card-body{padding:30px}
.label{display:block;font-weight:700;margin-bottom:10px;color:var(--navy);font-size:.92rem;text-transform:uppercase;letter-spacing:.05em}
.materials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.material-btn{padding:14px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:16px;font-weight:700;cursor:pointer;transition:.18s ease}
.material-btn:hover{border-color:var(--yellow);background:var(--yellow-soft)}
.material-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 6px 16px rgba(31,47,70,.16)}
.search-wrap{position:relative}
#search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:10px;font-size:16px;outline:none;background:#fff;color:var(--text);transition:.18s ease}
#search:focus{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow-soft)}
#search:disabled{background:#f5f5f5;color:#9ca3af;cursor:not-allowed}
.dropdown{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);max-height:360px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 30px rgba(31,41,55,.12);display:none}
.dropdown.show{display:block}
.option{display:block;width:100%;text-align:left;padding:13px 14px;border:0;border-bottom:1px solid #edf0f2;background:#fff;cursor:pointer}
.option:last-child{border-bottom:0}.option:hover,.option.focused{background:var(--yellow-soft)}
.option-main{font-weight:700;font-size:15px;color:var(--navy)}
.option-sub{margin-top:4px;color:var(--muted);font-size:13px}
.hint{margin:9px 2px 0;color:var(--muted);font-size:13px}
.result{margin-top:26px;display:none}.result.show{display:block}
.result-top{border-radius:14px;background:var(--navy);color:#fff;padding:22px;box-shadow:0 8px 20px rgba(31,47,70,.12)}
.result-material{font-size:12px;text-transform:uppercase;letter-spacing:.14em;opacity:.72;font-weight:700}
.result-name{font-size:27px;font-weight:800;margin-top:6px}.result-detail{font-size:16px;margin-top:6px;opacity:.88}
.location-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.location-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;box-shadow:0 6px 18px rgba(31,41,55,.05)}
.location-label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.location-value{font-size:42px;font-weight:900;margin-top:4px;color:var(--navy)}
.no-results{padding:18px;text-align:center;color:var(--muted)}
.footer-note{margin-top:22px;text-align:center;color:#8a8f98;font-size:.8rem}
@media(max-width:820px){.header{align-items:flex-start;flex-direction:column}.card-body{padding:24px}}
@media(max-width:620px){.page-shell{padding:22px 14px 40px}.materials{grid-template-columns:1fr}.location-value{font-size:34px}.location-grid{grid-template-columns:1fr 1fr}.card-body{padding:18px}}
</style>
</head>
<body>
<div class="page-shell">
<div class="wrap">
  <header class="header">
    <div class="brand-block">
      <div class="eyebrow">KB Home • Austin Design Studio</div>
      <h1>Studio Plan-o-Gram</h1>
      <p>Find flooring, tile, carpet, wood, and other Studio samples.</p>
    </div>
    <div class="status-pill"><span class="status-dot"></span>Sample Finder</div>
  </header>

  <div class="card">
    <div class="card-accent"></div>
    <div class="card-body">
    <label class="label">1. Choose Material</label>
    <div class="materials">
      <button class="material-btn" data-material="Carpet">Carpet</button>
      <button class="material-btn" data-material="LVP & Wood">LVP & Wood</button>
      <button class="material-btn" data-material="Tile">Tile</button>
    </div>

    <label class="label" for="search">2. Find Sample</label>
    <div class="search-wrap">
      <input id="search" type="text" autocomplete="off" placeholder="Choose a material first…" disabled>
      <div class="dropdown" id="dropdown"></div>
    </div>
    <div class="hint">Start typing any part of the collection name, color name, color code, or size.</div>

    <section class="result" id="result">
      <div class="result-top">
        <div class="result-material" id="resultMaterial"></div>
        <div class="result-name" id="resultName"></div>
        <div class="result-detail" id="resultDetail"></div>
      </div>
      <div class="location-grid">
        <div class="location-box">
          <div class="location-label">Bay</div>
          <div class="location-value" id="resultBay"></div>
        </div>
        <div class="location-box">
          <div class="location-label" id="locationLabel">Slot</div>
          <div class="location-value" id="resultLocation"></div>
        </div>
      </div>
    </section>
    </div>
  </div>

  <div class="footer-note">Austin Design Studio • Internal Studio Resource</div>
</div>
</div>

// The website combines the three easy-to-edit lists above automatically.
const samples = [
  ...carpetSamples.map(x => ({
    material: "Carpet",
    collection: x.collection,
    color: x.color,
    size: "",
    bay: x.bay,
    locationType: "Shelf",
    location: x.shelf
  })),
  ...lvpSamples.map(x => ({
    material: "LVP & Wood",
    collection: x.collection,
    color: x.color,
    size: x.size,
    bay: x.bay,
    locationType: "Slot",
    location: x.slot
  })),
  ...tileSamples.map(x => ({
    material: "Tile",
    collection: x.collection,
    color: x.color,
    size: x.size,
    bay: x.bay,
    locationType: "Slot",
    location: x.slot
  }))
];
// ============================================================

let selectedMaterial = "";
let visibleMatches = [];
let focusedIndex = -1;

const search = document.getElementById("search");
const dropdown = document.getElementById("dropdown");
const result = document.getElementById("result");

function normalize(value) {
  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function searchText(item) {
  return normalize([item.collection, item.color, item.size].join(" "));
}

function chooseMaterial(material, button) {
  selectedMaterial = material;
  document.querySelectorAll(".material-btn").forEach(b => b.classList.remove("active"));
  button.classList.add("active");

  search.disabled = false;
  search.value = "";
  search.placeholder = `Search ${material}…`;
  dropdown.innerHTML = "";
  dropdown.classList.remove("show");
  result.classList.remove("show");
  search.focus();
}

document.querySelectorAll(".material-btn").forEach(button => {
  button.addEventListener("click", () => chooseMaterial(button.dataset.material, button));
});

function renderMatches() {
  if (!selectedMaterial) return;

  const q = normalize(search.value);
  const pool = samples.filter(x => x.material === selectedMaterial);

  visibleMatches = pool.filter(item => {
    if (!q) return true;
    const words = q.split(" ");
    const hay = searchText(item);
    return words.every(word => hay.includes(word));
  }).slice(0, 40);

  focusedIndex = -1;
  dropdown.innerHTML = "";

  if (!visibleMatches.length) {
    dropdown.innerHTML = '<div class="no-results">No matching samples found.</div>';
    dropdown.classList.add("show");
    return;
  }

  visibleMatches.forEach((item, index) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.type = "button";

    const main = document.createElement("div");
    main.className = "option-main";
    main.textContent = `${item.collection} — ${item.color}`;

    const sub = document.createElement("div");
    sub.className = "option-sub";
    const pieces = [];
    if (item.size) pieces.push(item.size);
    pieces.push(`Bay ${item.bay}`);
    pieces.push(`${item.locationType} ${item.location}`);
    sub.textContent = pieces.join(" • ");

    btn.append(main, sub);
    btn.addEventListener("click", () => selectItem(item));
    dropdown.appendChild(btn);
  });

  dropdown.classList.add("show");
}

function selectItem(item) {
  search.value = `${item.collection} — ${item.color}`;
  dropdown.classList.remove("show");

  document.getElementById("resultMaterial").textContent = item.material;
  document.getElementById("resultName").textContent = item.collection;
  document.getElementById("resultDetail").textContent =
    [item.size, item.color].filter(Boolean).join(" • ");
  document.getElementById("resultBay").textContent = item.bay;
  document.getElementById("locationLabel").textContent = item.locationType;
  document.getElementById("resultLocation").textContent = item.location;

  result.classList.add("show");
}

search.addEventListener("input", () => {
  result.classList.remove("show");
  renderMatches();
});

search.addEventListener("focus", () => {
  if (selectedMaterial) renderMatches();
});

search.addEventListener("keydown", (event) => {
  const options = [...dropdown.querySelectorAll(".option")];
  if (!options.length) return;

  if (event.key === "ArrowDown") {
    event.preventDefault();
    focusedIndex = Math.min(focusedIndex + 1, options.length - 1);
  } else if (event.key === "ArrowUp") {
    event.preventDefault();
    focusedIndex = Math.max(focusedIndex - 1, 0);
  } else if (event.key === "Enter" && focusedIndex >= 0) {
    event.preventDefault();
    options[focusedIndex].click();
    return;
  } else if (event.key === "Escape") {
    dropdown.classList.remove("show");
    return;
  } else {
    return;
  }

  options.forEach((o,i) => o.classList.toggle("focused", i === focusedIndex));
  options[focusedIndex]?.scrollIntoView({block:"nearest"});
});

document.addEventListener("click", event => {
  if (!event.target.closest(".search-wrap")) dropdown.classList.remove("show");
});
